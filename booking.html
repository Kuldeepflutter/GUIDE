<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Book Your Trip — GuideGo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'}</script>
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css"/>
<link rel="stylesheet" href="style.css"/>
<script src="theme.js"></script>
</head>
<body>
<section style="padding:30px 0 60px">
  <div class="container-x">
    <h1 style="font-family:'Space Grotesk';font-size:2rem;font-weight:800" data-reveal>Book your trip</h1>
    <p style="color:var(--text-soft);margin-top:4px" data-reveal>7 steps. Cancel free up to 48 hours before.</p>

    <div class="glass" style="margin-top:20px;padding:18px;display:flex;align-items:center;gap:6px;overflow-x:auto" id="ggStepsBar"></div>

    <div style="display:grid;grid-template-columns:1fr 340px;gap:24px;margin-top:20px" id="bookLayout">
      <div>
        <div data-panel="1" class="glass" style="padding:24px">
          <h2 style="font-weight:700;margin-bottom:14px">Pick a destination</h2>
          <div id="ggBookDest" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px"></div>
        </div>
        <div data-panel="2" class="glass" style="padding:24px;display:none">
          <h2 style="font-weight:700;margin-bottom:14px">Choose your guide</h2>
          <div id="ggBookGuides" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px"></div>
        </div>
        <div data-panel="3" class="glass" style="padding:24px;display:none">
          <h2 style="font-weight:700;margin-bottom:14px">Pick a date</h2>
          <div id="ggBookCal"></div>
        </div>
        <div data-panel="4" class="glass" style="padding:24px;display:none">
          <h2 style="font-weight:700;margin-bottom:14px">Select time slot</h2>
          <div id="ggBookTimes" style="display:flex;gap:10px;flex-wrap:wrap"></div>
        </div>
        <div data-panel="5" class="glass" style="padding:24px;display:none">
          <h2 style="font-weight:700;margin-bottom:14px">Group size & tour type</h2>
          <div id="ggBookGroup"></div>
        </div>
        <div data-panel="6" class="glass" style="padding:24px;display:none">
          <h2 style="font-weight:700;margin-bottom:14px">Payment</h2>
          <div id="ggBookPay"></div>
        </div>
        <div data-panel="7" class="glass" style="padding:0;display:none">
          <div id="ggBookConfirm"></div>
        </div>

        <div style="display:flex;justify-content:space-between;margin-top:16px">
          <button class="btn btn-ghost" onclick="GG_booking.prev()"><i data-lucide="arrow-left" style="width:14px;height:14px"></i> Back</button>
          <button class="btn btn-primary" onclick="GG_booking.next()">Continue <i data-lucide="arrow-right" style="width:14px;height:14px"></i></button>
        </div>
      </div>

      <aside>
        <div class="glass" style="padding:20px;position:sticky;top:90px" data-reveal>
          <div style="font-size:.78rem;color:var(--text-soft)">Live total</div>
          <div id="ggPriceLive" style="font-family:'Space Grotesk';font-size:2.2rem;font-weight:800;color:var(--primary)">₹0</div>
          <div id="ggPriceBreak" style="font-size:.78rem;color:var(--text-soft);margin-top:6px;line-height:1.6"></div>
          <div class="divider"></div>
          <div style="display:flex;flex-direction:column;gap:8px;font-size:.82rem">
            <span><i data-lucide="shield-check" style="width:14px;height:14px;color:var(--accent);display:inline"></i> Free cancellation 48h</span>
            <span><i data-lucide="lock" style="width:14px;height:14px;color:var(--primary);display:inline"></i> Secure UPI / cards</span>
            <span><i data-lucide="qr-code" style="width:14px;height:14px;color:var(--primary-2);display:inline"></i> Instant QR pass</span>
          </div>
        </div>
      </aside>
    </div>
  </div>
</section>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="script.js"></script><script src="chatbot.js"></script><script src="animations.js"></script>
<script src="booking.js"></script>
<script>GG_booking.init(); GG.boot('');</script>
<style>@media(max-width:860px){ #bookLayout{grid-template-columns:1fr !important} aside .glass{position:static !important}}</style>
</body></html>
