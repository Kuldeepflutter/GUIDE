<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login — GuideGo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'}</script>
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css"/>
<link rel="stylesheet" href="style.css"/>
<script src="theme.js"></script>
</head>
<body class="hero">
<section style="min-height:90vh;display:grid;place-items:center;padding:60px 20px">
  <div class="glass" style="width:100%;max-width:440px;padding:32px" data-reveal data-reveal-once>
    <a href="index.html" style="display:inline-flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.15rem;margin-bottom:18px">
      <span style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:grid;place-items:center;color:#fff"><i data-lucide="compass" style="width:18px;height:18px"></i></span> GuideGo
    </a>
    <h1 style="font-family:'Space Grotesk';font-size:1.8rem;font-weight:800">Welcome back</h1>
    <p style="color:var(--text-soft);font-size:.9rem;margin-bottom:20px">Sign in to continue your journey</p>

    <form onsubmit="GG_handleLogin(event)" style="display:grid;gap:12px">
      <div>
        <label style="font-size:.78rem;color:var(--text-soft);font-weight:600">Email</label>
        <input name="email" type="email" required class="input" style="margin-top:6px" placeholder="you@example.com"/>
      </div>
      <div>
        <label style="font-size:.78rem;color:var(--text-soft);font-weight:600">Password</label>
        <div style="position:relative;margin-top:6px">
          <input id="pw" name="password" type="password" required class="input" placeholder="••••••••" style="padding-right:42px"/>
          <button type="button" onclick="const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--text-soft)"><i data-lucide="eye" style="width:16px;height:16px"></i></button>
        </div>
      </div>
      <div>
        <label style="font-size:.78rem;color:var(--text-soft);font-weight:600">I am a</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">
          <label class="btn btn-neo btn-sm" style="cursor:pointer;justify-content:center"><input type="radio" name="role" value="traveler" checked style="margin-right:6px"/> Traveler</label>
          <label class="btn btn-neo btn-sm" style="cursor:pointer;justify-content:center"><input type="radio" name="role" value="guide" style="margin-right:6px"/> Guide</label>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:.82rem">
        <label style="display:flex;align-items:center;gap:6px;color:var(--text-soft)"><input type="checkbox"/> Remember me</label>
        <a href="#" style="color:var(--primary);font-weight:600">Forgot password?</a>
      </div>
      <button class="btn btn-primary" style="justify-content:center;margin-top:6px">Sign in</button>
    </form>

    <div style="display:flex;align-items:center;gap:10px;margin:18px 0"><div style="flex:1;height:1px;background:var(--border)"></div><span style="font-size:.72rem;color:var(--text-soft)">OR</span><div style="flex:1;height:1px;background:var(--border)"></div></div>
    <button class="btn btn-neo" style="width:100%;justify-content:center" onclick="GG_googleAuth()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <p style="text-align:center;font-size:.85rem;color:var(--text-soft);margin-top:18px">New to GuideGo? <a href="signup.html" style="color:var(--primary);font-weight:600">Create account</a></p>
  </div>
</section>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="script.js"></script><script src="auth.js"></script>
<script>GG.boot('');</script>
</body></html>
